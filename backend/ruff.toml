# 后端最小静态门禁。
#
# 只启用 pyflakes 等价的关键规则集：语法错误、未定义名、未使用导入/变量、
# 未定义/遮蔽的 `__all__` 等。目的是在 CI 上拦住"跑不起来/引用不存在"的低级
# 错误，而不是一次引入数千条风格噪音。后续可按批扩大 select。
#
# 规则含义：
#   E9  = 语法/解析类致命错误
#   F63 = 无效的 `__all__` 条目
#   F7  = 语法层面的可疑写法（如 return/break 在 finally 外等）
#   F82 = 未定义的名称
target-version = "py311"

[lint]
select = ["E9", "F63", "F7", "F82"]
