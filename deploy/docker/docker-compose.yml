# CampusMate AI —— 四服务一键编排
#
# 用法（在仓库根目录）：
#   cp deploy/docker/.env.example deploy/docker/.env   # 首次：填密钥
#   docker compose -f deploy/docker/docker-compose.yml up --build
#
# 服务拓扑（与本地 start_all.bat 一致）：
#   webreact(5174, Nginx)  --/api-->  backend(8000)
#                                        |
#                                        +--> magicclass-service(4010)   自研受管服务
#                                        +--> magicclass-app(3000)       上游「学习空间」
#
# 说明：
# - 只有 webreact(5174)、backend(8000)、magicclass-app(3000) 发布到宿主机，
#   因为它们是浏览器要直接访问的入口；magicclass-service 只在容器网络内可见。
# - 所有有状态数据（SQLite / 上传 / 缓存 / 知识库）都落在具名卷里，
#   `docker compose down` 不会删数据；要清空用 `down -v`。

name: campusmate

services:
  # ---------- 自研受管 magic class 服务（融合链路） ----------
  magicclass-service:
    build:
      context: ../../magicclass-service
    environment:
      # 容器内必须监听 0.0.0.0，否则只绑 loopback，backend 连不上。
      MAGICCLASS_HOST: 0.0.0.0
      MAGICCLASS_PORT: "4010"
      MAGICCLASS_DATABASE_URL: ./data/magicclass-service.db
      # 与 backend 共享的断言密钥，缺了服务会拒绝启动（fail-closed）。
      MAGICCLASS_INTERNAL_SECRET: ${MAGICCLASS_INTERNAL_SECRET:?请在 deploy/docker/.env 设置 MAGICCLASS_INTERNAL_SECRET}
      # 可选：内容生成 / 多智能体讨论走 OpenAI 兼容端点（不配则降级到本地模板）。
      MAGICCLASS_PROVIDER_BASE_URL: ${MAGICCLASS_PROVIDER_BASE_URL:-}
      MAGICCLASS_PROVIDER_API_KEY: ${MAGICCLASS_PROVIDER_API_KEY:-}
      MAGICCLASS_PROVIDER_MODEL: ${MAGICCLASS_PROVIDER_MODEL:-}
      # 可选：课堂语音合成（MiMo TTS）。
      MAGICCLASS_TTS_BASE_URL: ${MAGICCLASS_TTS_BASE_URL:-}
      MAGICCLASS_TTS_API_KEY: ${MAGICCLASS_TTS_API_KEY:-}
    volumes:
      - magicclass-service-data:/app/data
    networks:
      - campusmate
    restart: unless-stopped

  # ---------- FastAPI 后端 ----------
  backend:
    build:
      context: ../../backend
    # 后端密钥来源，按顺序加载，后者覆盖前者：
    #   1) backend/.env  —— 既有用法，LLM / 火山 / MiMo / UAPI 等密钥常放这里；
    #   2) deploy/docker/.env —— 本编排模板声明的键也在这里生效，用来覆盖上一项。
    # 两个文件都不存在时不报错。注意 Compose 的两条语义：
    #   - `environment:` 里的**无值键**会被解析成空值并删除 env_file 里的同名变量，
    #     所以不能用它做"有值才覆盖"的透传；
    #   - `env_file` 列表里靠后的文件**无条件覆盖**靠前的文件，**空值也算覆盖**。
    # 因此要覆盖 backend/.env 的键必须在 deploy/docker/.env 里填真实值；
    # 不想覆盖的键要整行注释或删除，不能写成 `KEY=`（见 .env.example 说明）。
    env_file:
      - path: ../../backend/.env
        required: false
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_URL: sqlite:///./data/app.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      # 可信反向代理地址。uvicorn 默认只信任 127.0.0.1，而本拓扑里 Nginx 在
      # 容器网络内（非 127.0.0.1），否则 X-Forwarded-For 会被忽略，所有经代理
      # 的用户都塌缩成同一个 request.client.host —— 二维码创建、壁纸等按 ASGI
      # peer 的限流会共享额度、互相拖累。
      # 这里只信任 Nginx 容器的固定地址（webreact 的 ipv4_address），因此：
      #   - 不同真实客户端经代理后额度彼此分离；
      #   - 客户端伪造 X-Forwarded-For 无效（uvicorn 取最右侧不可信地址）；
      #   - 宿主直连 backend 发布端口时 peer 是网关(172.28.0.1)，不在信任表内，
      #     伪造的转发头同样不被采信。
      # 禁止设成 *（FORWARDED_ALLOW_IPS=* 会无条件信任任何来源的 XFF）。
      # 若改了 webreact 的 ipv4_address，这里要同步。
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.2}
      # 本地起开发栈时默认准备演示账号（与 start_all.bat 行为一致）。
      AUTO_SEED_DEMO_USERS: ${AUTO_SEED_DEMO_USERS:-true}

      # ---- magic class 融合链路（三个键缺一个，workspaces 路由就回 503）----
      MAGICCLASS_FUSION_ENABLED: "true"
      MAGICCLASS_SERVICE_URL: http://magicclass-service:4010
      MAGICCLASS_INTERNAL_SECRET: ${MAGICCLASS_INTERNAL_SECRET:?请在 deploy/docker/.env 设置 MAGICCLASS_INTERNAL_SECRET}

      # ---- 导航栏「学习空间」（三个键缺一个，入口只显示"尚未启用"）----
      MAGICCLASS_ENABLED: "true"
      # 内部地址：只有服务端可见，走容器网络。
      MAGICCLASS_BASE_URL: http://magicclass-app:3000
      # 浏览器公开地址：必须是浏览器真正能打开的地址（这里=宿主机映射后的 3000）。
      MAGICCLASS_EMBED_ORIGIN: ${MAGICCLASS_EMBED_ORIGIN:-http://localhost:3000}
    volumes:
      - backend-data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      magicclass-service:
        condition: service_healthy
    networks:
      campusmate:
        # 固定地址，避免动态分配抢占 webreact 的静态地址 172.28.0.2。
        ipv4_address: 172.28.0.3
    restart: unless-stopped

  # ---------- 上游「学习空间」应用（Next.js standalone） ----------
  magicclass-app:
    build:
      context: ../../magicclass-app
      args:
        # 构建期变量：放行本站 Origin 内嵌课堂。改了要重新 build。
        ALLOWED_FRAME_ANCESTORS: ${ALLOWED_FRAME_ANCESTORS:-http://localhost:5174 http://127.0.0.1:5174}
        # 构建期开关：MP4 导出入口（导出菜单里的“导出视频”）。默认关闭，
        # 需在 deploy/docker/.env 设 NEXT_PUBLIC_ENABLE_VIDEO_EXPORT=true 后重新 build。
        # 它只控制前端入口是否显示；实际能力由下面的 RENDER_SERVICE_URL + /health 探测决定。
        NEXT_PUBLIC_ENABLE_VIDEO_EXPORT: ${NEXT_PUBLIC_ENABLE_VIDEO_EXPORT:-}
        # 构建期网络：国内镜像源 / 宿主机代理（见 deploy/docker/.env）。
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # standalone 用 `node server.js` 启动，不经过 npm，因此 npm_package_version
      # 取不到，/api/health 会回落成硬编码 0.1.0。这里显式补上真实版本。
      npm_package_version: "1.0.3"
      # 内部渲染服务地址（容器网络内，只服务端可见）。app 的导出能力接口会探测
      # 它的 /health：启用 video-export profile 时返回可用，否则探测失败并降级为
      # 仅下载 ZIP。设置该地址本身不会虚假声明渲染可用。
      RENDER_SERVICE_URL: http://render-service:9000
      # 服务端默认模型（不配时服务端 stage 会因解析不到模型而失败）。
      DEFAULT_MODEL: ${MAGICCLASS_APP_DEFAULT_MODEL:-}
      # 可选：上游自己的 LLM / TTS / ASR Provider 密钥（按需填，不填则对应能力不可用）。
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      XIAOMI_API_KEY: ${XIAOMI_API_KEY:-}
      XIAOMI_BASE_URL: ${XIAOMI_BASE_URL:-}
      TTS_MIMO_API_KEY: ${TTS_MIMO_API_KEY:-}
      TTS_MIMO_BASE_URL: ${TTS_MIMO_BASE_URL:-}
    volumes:
      - magicclass-app-data:/app/data
    ports:
      - "${MAGICCLASS_APP_PORT:-3000}:3000"
    networks:
      - campusmate
    restart: unless-stopped

  # ---------- Web 前端（React + Vite 静态产物，Nginx 托管） ----------
  webreact:
    build:
      context: ../../webreact
      args:
        # 构建期网络：国内镜像源 / 宿主机代理（见 deploy/docker/.env）。
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
    ports:
      - "${WEB_PORT:-5174}:5174"
    depends_on:
      - backend
    networks:
      campusmate:
        # Nginx 代理的固定地址：backend 只信任这一个地址转发来的 X-Forwarded-For，
        # 因此其它来源（含宿主直连）无法靠伪造转发头绕过按 peer 的限流。
        ipv4_address: 172.28.0.2
    restart: unless-stopped

  # ---------- 可选：隔离的 MP4 导出服务（重，默认不启动） ----------
  #   docker compose -f deploy/docker/docker-compose.yml --profile video-export up --build
  render-service:
    profiles:
      - video-export
    build:
      context: ../../magicclass-app/render-service
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
    # 入口脚本默认安装 iptables 出网封锁（隔离不可信 Chromium），这需要
    # CAP_NET_ADMIN。缺失时脚本 fail-closed 退出，容器会不断重启；这里补上该
    # 能力。用最小能力而非 privileged，也不关闭防火墙来绕过。
    cap_add:
      - NET_ADMIN
    expose:
      - "9000"
    environment:
      PORT: "9000"
      RENDER_RESOURCE_PROFILE: ${RENDER_RESOURCE_PROFILE:-standard}
      PRODUCER_HEADLESS_SHELL_PATH: /usr/bin/chromium-headless-shell
    mem_limit: ${RENDER_SERVICE_MEMORY_LIMIT:-8g}
    shm_size: 2gb
    networks:
      - campusmate
    restart: unless-stopped

networks:
  campusmate:
    driver: bridge
    # 固定子网，使 webreact(Nginx) 获得可预测的地址，便于把后端可信代理
    # 精确配置成该地址（见 backend 的 FORWARDED_ALLOW_IPS），而不是信任整个
    # 私有网段 —— 否则宿主直连 backend 发布端口时也会被当成可信代理，
    # 客户端就能用伪造的 X-Forwarded-For 绕过按 peer 的限流。
    # 若该网段与既有网络冲突，改这里的 subnet 并同步 backend 的 FORWARDED_ALLOW_IPS。
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  backend-data:
  magicclass-service-data:
  magicclass-app-data:
