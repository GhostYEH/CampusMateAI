name: WeChat Skill Update Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  update-guardian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run health check
        run: npm run wx:health-check

      - name: Optional issue template
        if: env.ALLOW_AUTO_ISSUE == 'true'
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/wechat-skill-update-issue-template.md <<'EOF'
          # WeChat Skill Update Guardian Report

          Attach the uploaded artifacts and review:

          - wechat-skill-health-report.md
          - official-update-report.md
          - dependency-version-report.md

          This workflow does not create issues by default.
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-skill-update-check
          path: |
            artifacts/wechat-skill-health-report.md
            artifacts/wechat-skill-health-report.json
            artifacts/official-update-report.md
            artifacts/official-update-report.json
            artifacts/dependency-version-report.md
            artifacts/dependency-version-report.json
            artifacts/update-guardian-report.md
            artifacts/update-guardian-report.json
            artifacts/wechat-skill-update-issue-template.md
          if-no-files-found: ignore
