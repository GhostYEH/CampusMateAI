name: WeChat Mini Program

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: preview, upload, or both
        required: false
        default: preview
  push:
    branches:
      - main

jobs:
  wechat-miniprogram:
    runs-on: ubuntu-latest
    env:
      WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
      WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
      WECHAT_PROJECT_PATH: ${{ secrets.WECHAT_PROJECT_PATH }}
      WECHAT_ROBOT: ${{ secrets.WECHAT_ROBOT || '1' }}
      WECHAT_DEPLOY_MODE: ${{ github.event.inputs.deploy_mode || secrets.WECHAT_DEPLOY_MODE || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f bun.lockb ]; then
            echo "manager=bun" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable pnpm
        if: steps.pm.outputs.manager == 'pnpm'
        run: corepack enable pnpm

      - name: Enable yarn
        if: steps.pm.outputs.manager == 'yarn'
        run: corepack enable yarn

      - name: Setup Bun
        if: steps.pm.outputs.manager == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ steps.pm.outputs.manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "${{ steps.pm.outputs.manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ steps.pm.outputs.manager }}" = "bun" ]; then
            bun install
          else
            npm ci || npm install
          fi

      - name: Build if available
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 2)"; then
            if [ "${{ steps.pm.outputs.manager }}" = "pnpm" ]; then
              pnpm run build
            elif [ "${{ steps.pm.outputs.manager }}" = "yarn" ]; then
              yarn run build
            elif [ "${{ steps.pm.outputs.manager }}" = "bun" ]; then
              bun run build
            else
              npm run build
            fi
          else
            echo "No build script found; skipping build."
          fi

      - name: Validate
        run: npm run wx:validate

      - name: Preview or upload
        shell: bash
        run: |
          if [ "$WECHAT_DEPLOY_MODE" = "upload" ]; then
            npm run wx:upload
          elif [ "$WECHAT_DEPLOY_MODE" = "both" ]; then
            npm run wx:preview
            npm run wx:upload
          else
            npm run wx:preview
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-miniprogram-artifacts
          path: |
            artifacts/wechat-preview-qrcode.jpg
            artifacts/wechat-inspect-report.json
            artifacts/wechat-validation-report.json
            artifacts/wechat-upload-report.json
            artifacts/wechat-deploy-report.json
            artifacts/wechat-experience-preflight.json
          if-no-files-found: ignore
