name: campus_companion
description: 大学生校园事务智能陪伴助手 - 校园通知整理 / 待办 / AI导员 / 学习陪伴 / 表情识别
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理与路由
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0

  # 网络与本地存储
  dio: ^5.5.0+1
  shared_preferences: ^2.3.0

  # 本地提醒
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  # 系统时区(IANA 名称)— DateTime.now().timeZoneName 不可靠,见 AGENTS.md 提醒规范
  flutter_timezone: ^3.0.1

  # 摄像头(后续CNN接入预留)
  camera: ^0.11.0+1

  # 工具库
  intl: ^0.20.2
  uuid: ^4.4.0
  collection: ^1.18.0
  equatable: ^2.0.5
  google_fonts: ^6.2.1

  # Markdown 渲染(AI 导员回答排版)
  flutter_markdown: ^0.7.4+3
  markdown: ^7.2.2

  # 文件选择(知识库文档上传)
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/home/
