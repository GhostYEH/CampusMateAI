<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>微信小程序首页视觉 QA</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { overflow-x: hidden; }
    button { border: 0; }
    img { display: block; }
    h2 { margin: 0; }
    .light-only, .dark-only { display: block; }
    .dark .light-only { display: none; }
    #preview:not(.dark) .dark-only { display: none; }
  </style>
</head>
<body>
  <main id="preview" class="page tab-page home-page">
    <button class="profile-entry">
      <img class="profile-avatar" src="../miniprogram/assets/profile-avatar.png" alt="" />
      <span class="profile-copy">
        <span class="profile-name">林知夏</span>
        <span class="profile-hint">点击头像进入个人中心</span>
      </span>
    </button>

    <section class="home-content">
      <article class="hero">
        <img class="hero-image" src="../miniprogram/assets/home-hero.jpg" alt="" />
        <div class="hero-content">
          <div class="hero-title">期末考试周进行中</div>
          <div class="hero-copy">合理规划时间，稳住节奏，我们能赢。</div>
          <button class="hero-button">
            <span>查看复习计划</span>
            <img class="hero-arrow" src="../miniprogram/assets/icons/arrow-right.svg" alt="" />
          </button>
        </div>
        <div class="hero-dots"><i class="hero-dot active"></i><i class="hero-dot"></i><i class="hero-dot"></i><i class="hero-dot"></i></div>
      </article>

      <nav class="quick-panel">
        <button class="quick-action"><span class="quick-icon-wrap purple"><img class="quick-icon" src="../miniprogram/assets/icons/quick-calendar.svg" alt="" /></span><span class="quick-label">课程表</span></button>
        <button class="quick-action"><span class="quick-icon-wrap blue"><img class="quick-icon" src="../miniprogram/assets/icons/quick-task.svg" alt="" /><b class="quick-badge">3</b></span><span class="quick-label">待办任务</span></button>
        <button class="quick-action"><span class="quick-icon-wrap teal"><img class="quick-icon" src="../miniprogram/assets/icons/quick-notice.svg" alt="" /></span><span class="quick-label">校园通知</span></button>
        <button class="quick-action"><span class="quick-icon-wrap orange"><img class="quick-icon" src="../miniprogram/assets/icons/quick-study.svg" alt="" /></span><span class="quick-label">学习陪伴</span></button>
        <button class="quick-action"><span class="quick-icon-wrap purple"><img class="quick-icon" src="../miniprogram/assets/icons/quick-counselor.svg" alt="" /></span><span class="quick-label">AI 导员</span></button>
      </nav>

      <article class="today-panel section-surface">
        <header class="section-head"><h2 class="section-heading">今日课程</h2><button class="section-link">查看全部 ›</button></header>
        <div class="today-grid">
          <div class="next-course">
            <span class="next-pill">下一节</span>
            <div class="next-name">数据结构</div>
            <div class="next-detail"><img src="../miniprogram/assets/icons/clock-white.svg" alt="" /><span>10:00 · 进行中</span></div>
            <div class="next-detail"><img src="../miniprogram/assets/icons/pin-white.svg" alt="" /><span>C-202 · 李老师</span></div>
          </div>
          <div class="course-stack">
            <div class="course-row"><i class="course-state-dot outline"></i><div class="course-copy"><div class="course-name">高等数学</div><div class="course-meta">08:00 · B-301</div></div><span class="course-status ended">已结束</span></div>
            <div class="course-divider"></div>
            <div class="course-row"><i class="course-state-dot"></i><div class="course-copy"><div class="course-name">计算机网络</div><div class="course-meta">14:00 · A-105</div></div><span class="course-status upcoming">未开始</span></div>
          </div>
        </div>
      </article>

      <section class="summary-grid">
        <article class="overview-panel section-surface">
          <header class="section-head compact"><h2 class="section-heading">学习总览</h2><img class="eye-icon light-only" src="../miniprogram/assets/icons/eye-light.svg" alt="" /><img class="eye-icon dark-only" src="../miniprogram/assets/icons/eye-dark.svg" alt="" /></header>
          <div class="overview-inner"><div class="overview-copy"><div class="overview-label">本周进度</div><div class="overview-value">72%</div><div class="overview-up">较上周</div><div class="overview-up">↑12%</div></div><canvas id="progressCanvas" class="progress-canvas"></canvas></div>
        </article>
        <article class="deadline-panel section-surface">
          <header class="section-head compact"><h2 class="section-heading">近期截止</h2><button class="section-link">更多 ›</button></header>
          <div class="deadline-list">
            <div class="deadline-row"><span class="deadline-icon-wrap blue"><img src="../miniprogram/assets/icons/deadline-blue.svg" alt="" /></span><div class="deadline-copy"><div class="deadline-title">《数据结构》作业三：链表与栈</div><div class="deadline-time">今天 23:59</div></div></div>
            <div class="deadline-row"><span class="deadline-icon-wrap orange"><img src="../miniprogram/assets/icons/deadline-orange.svg" alt="" /></span><div class="deadline-copy"><div class="deadline-title">《高等数学》习题课报告提交</div></div></div>
          </div>
        </article>
      </section>
    </section>

    <aside class="tab-shell">
      <nav class="tab-bar">
        <button class="tab-item selected"><span class="icon-wrap"><img class="tab-icon light-only" src="../miniprogram/assets/icons/tab-home-active-light.svg" alt="" /><img class="tab-icon dark-only" src="../miniprogram/assets/icons/tab-home-active-dark.svg" alt="" /></span><span class="tab-label">首页</span></button>
        <button class="tab-item"><span class="icon-wrap"><img class="tab-icon light-only" src="../miniprogram/assets/icons/tab-courses-inactive-light.svg" alt="" /><img class="tab-icon dark-only" src="../miniprogram/assets/icons/tab-courses-inactive-dark.svg" alt="" /></span><span class="tab-label">课程</span></button>
        <button class="tab-item"><span class="icon-wrap"><img class="tab-icon light-only" src="../miniprogram/assets/icons/tab-tasks-inactive-light.svg" alt="" /><img class="tab-icon dark-only" src="../miniprogram/assets/icons/tab-tasks-inactive-dark.svg" alt="" /><b class="task-badge">3</b></span><span class="tab-label">待办</span></button>
        <button class="tab-item"><span class="icon-wrap"><img class="tab-icon light-only" src="../miniprogram/assets/icons/tab-counselor-inactive-light.svg" alt="" /><img class="tab-icon dark-only" src="../miniprogram/assets/icons/tab-counselor-inactive-dark.svg" alt="" /></span><span class="tab-label">AI 导员</span></button>
        <button class="tab-item"><span class="icon-wrap"><img class="tab-icon light-only" src="../miniprogram/assets/icons/tab-profile-inactive-light.svg" alt="" /><img class="tab-icon dark-only" src="../miniprogram/assets/icons/tab-profile-inactive-dark.svg" alt="" /></span><span class="tab-label">我的</span></button>
      </nav>
    </aside>
  </main>

  <script>
    const darkMode = new URLSearchParams(location.search).get('theme') === 'dark'
    const preview = document.querySelector('#preview')
    const tabShell = document.querySelector('.tab-shell')
    if (darkMode) {
      preview.classList.add('dark')
      tabShell.classList.add('dark-tab')
    }

    Promise.all([
      fetch('../miniprogram/app.wxss').then((response) => response.text()),
      fetch('../miniprogram/pages/index/index.wxss').then((response) => response.text()),
      fetch('../miniprogram/custom-tab-bar/index.wxss').then((response) => response.text()),
    ]).then((styles) => {
      const ratio = 430 / 750
      const css = styles.join('\n')
        .replace(/^page\s*\{/m, '.page {')
        .replace(/([\d.]+)rpx/g, (_, value) => `${Number(value) * ratio}px`)
        .replace(/env\(safe-area-inset-bottom\)/g, '0px')
      const style = document.createElement('style')
      style.textContent = css + `
        .profile-entry{padding-top:58px}
        .profile-copy,.profile-name,.profile-hint,.hero-dots i,.course-state-dot{display:block}
        .next-detail img{width:${27 * ratio}px;height:${27 * ratio}px}
        .deadline-icon-wrap img{width:${35 * ratio}px;height:${35 * ratio}px}
        .tab-shell{bottom:8px}
      `
      document.head.append(style)

      const canvas = document.querySelector('#progressCanvas')
      const rect = canvas.getBoundingClientRect()
      const pixelRatio = window.devicePixelRatio || 1
      canvas.width = rect.width * pixelRatio
      canvas.height = rect.height * pixelRatio
      const context = canvas.getContext('2d')
      context.scale(pixelRatio, pixelRatio)
      const centerX = rect.width / 2
      const centerY = rect.height / 2
      const radius = Math.min(rect.width, rect.height) / 2 - 6
      context.lineWidth = 8
      context.strokeStyle = darkMode ? '#203F50' : '#E6EEF4'
      context.beginPath()
      context.arc(centerX, centerY, radius, 0, Math.PI * 2)
      context.stroke()
      context.strokeStyle = darkMode ? '#7182FF' : '#5268EB'
      context.beginPath()
      context.arc(centerX, centerY, radius, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * 0.72)
      context.stroke()
      context.fillStyle = darkMode ? '#7182FF' : '#5268EB'
      const baseY = centerY + 16
      context.fillRect(centerX - 8, baseY - 18, 5, 18)
      context.fillRect(centerX, baseY - 32, 5, 32)
      context.fillRect(centerX + 8, baseY - 24, 5, 24)
    })
  </script>
</body>
</html>
