[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campusai-behavior-recognition"
version = "0.1.0"
description = "Auditable student behavior training and ONNX export tools."
requires-python = ">=3.11,<3.14"

[tool.setuptools.packages.find]
where = ["src"]
