# ============================================================================
# FER2013 正式训练配置：custom_cnn（自定义浅层 CNN 基线）
# ============================================================================
# 标签顺序（契约，不得调整）：angry, disgust, fear, happy, sad, surprise, neutral
# 输入：1 通道 48x48 灰度（FER2013 原生尺寸），归一化 mean=0.5/std=0.5。
# 不使用 ImageNet 预训练（自定义结构），从头训练。
# ============================================================================

experiment_name: custom_cnn_fer2013
output_dir: artifacts/custom_cnn

label_order: [angry, disgust, fear, happy, sad, surprise, neutral]

# ----------------------------------------------------------------------------
# 数据工程：image_dir 格式，K:\深度学习代码 下有 train/ 与 test/ 两个 split。
# train_ratio=0.9 表示从 train 中切 90% 作为训练集，剩余 10% 作为验证集。
# test 完全不参与训练/调参/模型选择。
# ----------------------------------------------------------------------------
data:
  dataset_root: "K:/深度学习代码"
  format: image_dir
  csv_name: fer2013.csv
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0
  stratified: true
  split_seed: 42

# ----------------------------------------------------------------------------
# 数据增强（仅作用于训练集）
# ----------------------------------------------------------------------------
augmentation:
  enabled: true
  random_horizontal_flip: true
  rotation_degrees: 10.0
  random_crop_scale: [0.9, 1.0]
  brightness: 0.2
  contrast: 0.2
  cutout_prob: 0.3
  cutout_max_size: 8

# ----------------------------------------------------------------------------
# 模型输入：1 通道 48x48
# ----------------------------------------------------------------------------
input:
  size: 48
  channels: 1
  mean: [0.5]
  std: [0.5]

# ----------------------------------------------------------------------------
# 模型：custom_cnn（无预训练）
# ----------------------------------------------------------------------------
model:
  name: custom_cnn
  num_classes: 7
  pretrained: false
  freeze_backbone: false
  unfreeze_at_epoch: 0
  dropout: 0.3

# ----------------------------------------------------------------------------
# 损失：带类别权重 + 标签平滑的交叉熵
# ----------------------------------------------------------------------------
loss:
  type: cross_entropy
  use_class_weights: true
  label_smoothing: 0.1
  focal_alpha: 0.25
  focal_gamma: 2.0

# ----------------------------------------------------------------------------
# 优化器：AdamW
# ----------------------------------------------------------------------------
optimizer:
  type: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  momentum: 0.9
  unfreeze_lr: 1.0e-4

# ----------------------------------------------------------------------------
# 学习率调度：cosine 退火
# ----------------------------------------------------------------------------
scheduler:
  type: cosine
  step_gamma: 0.1
  step_size: 10
  cosine_eta_min: 1.0e-6

# ----------------------------------------------------------------------------
# 训练流程：60 epoch，早停 patience=8，按 val Macro-F1 选 best
# ----------------------------------------------------------------------------
train:
  epochs: 60
  batch_size: 128
  num_workers: 2
  early_stopping_patience: 8
  monitor: val_macro_f1
  amp: true
  grad_clip: 0.0
  seed: 42

# ----------------------------------------------------------------------------
# 导出
# ----------------------------------------------------------------------------
export:
  onnx: true
  tflite: true
  onnx_opset: 13
  consistency_max_mismatch: 0

# ----------------------------------------------------------------------------
# 基准测试
# ----------------------------------------------------------------------------
benchmark:
  warmup: 5
  repeats: 50
