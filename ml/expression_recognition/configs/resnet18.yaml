# ============================================================================
# FER2013 正式训练配置：resnet18（迁移学习对照）
# ============================================================================
# 标签顺序（契约，不得调整）：angry, disgust, fear, happy, sad, surprise, neutral
# 输入：3 通道 224x224（灰度复制到三通道），ImageNet 归一化。
# ImageNet 预训练 + 迁移学习，前 5 epoch 冻结骨干只训练分类头，
# 第 6 epoch 起解冻骨干并用更小学习率微调。
# ============================================================================

experiment_name: resnet18_fer2013
output_dir: artifacts/resnet18

label_order: [angry, disgust, fear, happy, sad, surprise, neutral]

data:
  dataset_root: "K:/深度学习代码"
  format: image_dir
  csv_name: fer2013.csv
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0
  stratified: true
  split_seed: 42

augmentation:
  enabled: true
  random_horizontal_flip: true
  rotation_degrees: 10.0
  random_crop_scale: [0.9, 1.0]
  brightness: 0.2
  contrast: 0.2
  cutout_prob: 0.3
  cutout_max_size: 8

# ImageNet 三通道 224x224
input:
  size: 224
  channels: 3
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: resnet18
  num_classes: 7
  pretrained: true
  freeze_backbone: true
  unfreeze_at_epoch: 5
  dropout: 0.3

loss:
  type: cross_entropy
  use_class_weights: true
  label_smoothing: 0.1
  focal_alpha: 0.25
  focal_gamma: 2.0

optimizer:
  type: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  momentum: 0.9
  unfreeze_lr: 1.0e-4

scheduler:
  type: cosine
  step_gamma: 0.1
  step_size: 10
  cosine_eta_min: 1.0e-6

train:
  epochs: 60
  batch_size: 64
  num_workers: 2
  early_stopping_patience: 8
  monitor: val_macro_f1
  amp: true
  grad_clip: 0.0
  seed: 42

export:
  onnx: true
  tflite: true
  onnx_opset: 13
  consistency_max_mismatch: 0

benchmark:
  warmup: 5
  repeats: 50
