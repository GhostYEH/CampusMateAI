# ============================================================================
# CampusMateAI 面部表情识别实验配置
# ============================================================================
# 标签顺序（契约，不得调整）：
#   angry, disgust, fear, happy, sad, surprise, neutral
# 科学边界：仅识别面部表情，不输出疲劳/注意力/焦虑症/心理疾病类别。
#
# 使用：
#   python -m expression_recognition.cli --config experiment_config.yaml run_all
# ============================================================================

experiment_name: mobilenet_v3_small_baseline
output_dir: runs/mobilenet_v3_small

# 标签顺序契约（与 constants.EXPRESSION_LABELS 必须一致；写在此处便于核对）
label_order: [angry, disgust, fear, happy, sad, surprise, neutral]

# ----------------------------------------------------------------------------
# 数据工程
# ----------------------------------------------------------------------------
data:
  # 数据集根目录。请手动放置 FER2013 数据后填入路径，本工程不自动下载。
  # CSV 格式：dataset_root/fer2013.csv（官方 emotion/pixels/Usage 列）。
  # image_dir 格式：dataset_root/{train,val,test}/{label}/*.png
  dataset_root: ""
  format: fer2013_csv
  csv_name: fer2013.csv
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  stratified: true
  split_seed: 42

# ----------------------------------------------------------------------------
# 数据增强（仅作用于训练集）
# ----------------------------------------------------------------------------
augmentation:
  enabled: true
  random_horizontal_flip: true
  rotation_degrees: 10.0
  random_crop_scale: [0.9, 1.0]
  brightness: 0.2
  contrast: 0.2
  cutout_prob: 0.3
  cutout_max_size: 8

# ----------------------------------------------------------------------------
# 模型输入
# ----------------------------------------------------------------------------
# 主部署候选 MobileNetV3-Small 用三通道 224x224（灰度复制到三通道 + ImageNet 归一化）。
input:
  size: 224
  channels: 3
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# ----------------------------------------------------------------------------
# 模型：custom_cnn / resnet18 / mobilenet_v3_small
# ----------------------------------------------------------------------------
model:
  name: mobilenet_v3_small
  num_classes: 7
  pretrained: true
  freeze_backbone: true
  unfreeze_at_epoch: 5
  dropout: 0.3

# ----------------------------------------------------------------------------
# 损失
# ----------------------------------------------------------------------------
loss:
  type: cross_entropy        # cross_entropy | focal
  use_class_weights: true
  label_smoothing: 0.1
  focal_alpha: 0.25
  focal_gamma: 2.0

# ----------------------------------------------------------------------------
# 优化器
# ----------------------------------------------------------------------------
optimizer:
  type: adamw                # adamw | sgd
  lr: 1.0e-3
  weight_decay: 1.0e-4
  momentum: 0.9              # 仅 sgd
  unfreeze_lr: 1.0e-4        # 解冻骨干后的学习率

# ----------------------------------------------------------------------------
# 学习率调度
# ----------------------------------------------------------------------------
scheduler:
  type: cosine               # cosine | step
  step_gamma: 0.1
  step_size: 10
  cosine_eta_min: 1.0e-6

# ----------------------------------------------------------------------------
# 训练流程
# ----------------------------------------------------------------------------
train:
  epochs: 60
  batch_size: 64
  num_workers: 2
  early_stopping_patience: 8
  monitor: val_macro_f1      # val_macro_f1 | val_loss
  amp: false                 # 混合精度，需要 CUDA
  grad_clip: 0.0             # >0 启用梯度裁剪
  seed: 42

# ----------------------------------------------------------------------------
# 导出
# ----------------------------------------------------------------------------
export:
  onnx: true
  tflite: true               # 环境不支持时自动跳过并记录
  onnx_opset: 13
  consistency_max_mismatch: 0

# ----------------------------------------------------------------------------
# 基准测试
# ----------------------------------------------------------------------------
benchmark:
  warmup: 5
  repeats: 50
