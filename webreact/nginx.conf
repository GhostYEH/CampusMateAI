# CampusMate Web 容器内的 Nginx 站点配置。
#
# 前端是纯静态 SPA，API 走同源 /api 反代到后端容器，
# 因此浏览器侧不需要额外配置后端地址，也不受 CORS 影响。

server {
    listen 5174;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS。配合下面的变量式 proxy_pass，
    # 把上游主机名解析从"nginx 启动时"推迟到"请求时"：
    # 否则 backend 尚未就绪时，nginx 会以
    # [emerg] host not found in upstream "backend" 直接退出。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 前端静态资源：找不到的路径回退到 index.html（前端路由接管）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API。counselor/chat 等是 SSE 流式接口，
    # 必须关闭 proxy_buffering，否则流会被缓冲、前端看不到增量输出。
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端托管的静态资源（头像、横幅、数字人等）。
    location /static/ {
        set $backend_static http://backend:8000;
        proxy_pass $backend_static;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
